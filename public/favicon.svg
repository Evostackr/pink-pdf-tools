<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d75" />
      <stop offset="50%" stop-color="#ff3e84" />
      <stop offset="100%" stop-color="#ff6b9d" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Brand Squircle with hot-pink gradient matching Header logo -->
  <rect width="512" height="512" rx="120" fill="url(#pinkGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="8" />

  <!-- White PDF Document Sheet with Folded Corner -->
  <g filter="url(#cardShadow)">
    <path
      d="M168 84 H316 L384 152 V396 C384 416 368 428 348 428 H164 C144 428 128 416 128 396 V124 C128 104 144 84 168 84 Z"
      fill="url(#sheetGrad)"
    />
    <!-- Corner Fold -->
    <path
      d="M316 84 V136 C316 145 323 152 332 152 H384 Z"
      fill="url(#foldGrad)"
    />
  </g>

  <!-- Pink PDF Lines on Document -->
  <g stroke="#ff2d75" stroke-width="22" stroke-linecap="round">
    <line x1="184" y1="224" x2="328" y2="224" />
    <line x1="184" y1="284" x2="328" y2="284" />
    <line x1="184" y1="344" x2="260" y2="344" />
  </g>

  <!-- Subtly styled 'PDF' badge tag on top left of sheet -->
  <rect x="180" y="128" width="68" height="28" rx="6" fill="#ff2d75" />
  <text x="214" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">PDF</text>
</svg>